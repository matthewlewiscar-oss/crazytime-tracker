name: Daily CrazyTime Data Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install network tools
      run: pip install requests

    - name: Run data harvesting script
      run: python tracker.py

    - name: Commit and save spreadsheet updates back to GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add crazytime_master_history.csv
        git commit -m "Auto-update: Synced latest live spins" || exit 0
        git push
