name: Continuous CrazyTime Data Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install network and parsing tools
      run: pip install requests beautifulsoup4

    - name: Run data harvesting script
      run: python tracker.py

    - name: Commit and save spreadsheet updates back to GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # FIX: Force Git to acknowledge the file even if it is completely brand new
        git add -A
        
        # Check if there are actually changes to commit so it doesn't error out
        if git diff --staged --quiet; then
          echo "✅ No new updates to push right now."
        else
          git commit -m "Auto-update: Synced latest live spins"
          git push
        fi
