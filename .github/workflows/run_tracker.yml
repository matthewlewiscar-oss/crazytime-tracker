name: Daily CrazyTime Data Sync
on:
  schedule:
    # This tells GitHub to run the script automatically every day at 12:00 AM UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # This allows you to also trigger it manually with a click
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install network tools
      run: pip install requests
    - name: Run data harvesting script
      run: python tracker.py
    - name: Commit and save spreadsheet updates back to GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        if [ -f crazytime_master_history.csv ]; then
          git add crazytime_master_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: Synced latest live spins"
            git push
          else
            echo "No changes to commit."
          fi
        else
          echo "crazytime_master_history.csv not found — skipping commit."
        fi
